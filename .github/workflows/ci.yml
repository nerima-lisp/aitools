name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The Nix test derivation has its own 30-minute limit. Leave five minutes
    # for Nix setup and for that limit to report before Actions cancels the job.
    timeout-minutes: 35
    steps:
      # persist-credentials: false. This job runs untrusted PR code via
      # the Nix test derivation, and never needs the token, so don't leave it
      # in .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Run Linux coverage suite
        run: nix build .#checks.x86_64-linux.coverage --max-jobs 1 --no-link --print-build-logs

  check-linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Run Linux test suite
        run: nix build .#checks.x86_64-linux.default --max-jobs 1 --no-link --print-build-logs

  check-linux-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Check generated command reference
        run: >-
          nix --option extra-substituters https://takeokunn-aitools.cachix.org
          --option extra-trusted-public-keys takeokunn-aitools.cachix.org-1:3HqAVajpH0kKeM3TJi5Z7rcBj6Y3CO17AbqkXKIuWvU=
          develop --command sbcl --script docs/tools/generate-reference.lisp --check

      - name: Evaluate flake checks on both platforms
        run: nix flake check --no-build --all-systems

      - name: Build Linux static checks
        run: >-
          nix build
          .#checks.x86_64-linux.paredit-lint
          .#checks.x86_64-linux.docs
          .#checks.x86_64-linux.formatting
          --max-jobs 1 --no-link --print-build-logs

      - name: Check committed diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          is_commit_sha() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] &&
              git cat-file -e "$1^{commit}" 2>/dev/null
          }

          if ! is_commit_sha "$HEAD_SHA"; then
            echo "diff head is missing or is not a commit." >&2
            exit 1
          fi

          case "$EVENT_NAME" in
            push)
              if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
                echo "push event has no previous commit to compare." >&2
                exit 1
              fi
              base_sha="$PUSH_BEFORE"
              ;;
            pull_request)
              if ! merge_line="$(git rev-list --parents -n 1 "$HEAD_SHA")"; then
                echo "could not resolve the pull request merge commit's parents." >&2
                exit 1
              fi

              merge_sha=''
              first_parent=''
              second_parent=''
              extra_parent=''
              read -r merge_sha first_parent second_parent extra_parent <<< "$merge_line"

              if [[ "$merge_sha" != "$HEAD_SHA" || -z "$first_parent" || -z "$second_parent" || -n "$extra_parent" ]] ||
                ! is_commit_sha "$first_parent" || ! is_commit_sha "$second_parent"; then
                echo "pull request head is not a resolvable two-parent merge commit." >&2
                exit 1
              fi

              base_sha="$first_parent"
              ;;
            workflow_dispatch)
              if ! base_sha="$(git merge-base "$HEAD_SHA" refs/remotes/origin/main)"; then
                echo "could not find a merge base with origin/main." >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if ! is_commit_sha "$base_sha"; then
            echo "diff base is missing or is not a commit." >&2
            exit 1
          fi
          git diff --check "$base_sha" "$HEAD_SHA"

  check-linux-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Measure search allocation with cold cache (Linux)
        env:
          AITOOLS_HOST_CACHE_DIR: ${{ runner.temp }}/aitools-search-allocation-host-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/aitools-search-allocation-xdg-cache
        run: |
          mkdir -p "$AITOOLS_HOST_CACHE_DIR" "$XDG_CACHE_HOME"
          test -z "$(find "$AITOOLS_HOST_CACHE_DIR" -mindepth 1 -print -quit)"
          test -z "$(find "$XDG_CACHE_HOME" -mindepth 1 -print -quit)"
          AITOOLS_ALLOCATION_CACHE_STATE=cold nix --option extra-substituters https://takeokunn-aitools.cachix.org --option extra-trusted-public-keys takeokunn-aitools.cachix.org-1:3HqAVajpH0kKeM3TJi5Z7rcBj6Y3CO17AbqkXKIuWvU= develop --command sbcl --script t/perf/search-allocation-timing.lisp
          test -n "$(find "$AITOOLS_HOST_CACHE_DIR" -mindepth 1 -print -quit)"
          test -n "$(find "$XDG_CACHE_HOME" -mindepth 1 -print -quit)"

      - name: Measure search allocation with warm cache (Linux)
        env:
          AITOOLS_HOST_CACHE_DIR: ${{ runner.temp }}/aitools-search-allocation-host-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/aitools-search-allocation-xdg-cache
          AITOOLS_ALLOCATION_CACHE_STATE: warm
        run: nix --option extra-substituters https://takeokunn-aitools.cachix.org --option extra-trusted-public-keys takeokunn-aitools.cachix.org-1:3HqAVajpH0kKeM3TJi5Z7rcBj6Y3CO17AbqkXKIuWvU= develop --command sbcl --script t/perf/search-allocation-timing.lisp

  check-darwin-nix:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Check generated command reference
        run: >-
          nix --option extra-substituters https://takeokunn-aitools.cachix.org
          --option extra-trusted-public-keys takeokunn-aitools.cachix.org-1:3HqAVajpH0kKeM3TJi5Z7rcBj6Y3CO17AbqkXKIuWvU=
          develop --command sbcl --script docs/tools/generate-reference.lisp --check

      - name: Check Nix delivery, syntax, docs and formatting
        run: nix flake check --print-build-logs

  check-darwin-host:
    runs-on: macos-15
    needs: check-darwin-nix
    # The host runner allows 30 minutes for specs after Nix builds the delivery.
    # Leave time for setup and the build before the runner starts.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Run every spec against the delivery on the host
        run: nix run .#test --print-build-logs

      - name: Measure search allocation with cold cache (Darwin)
        env:
          AITOOLS_HOST_CACHE_DIR: ${{ runner.temp }}/aitools-search-allocation-host-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/aitools-search-allocation-xdg-cache
        run: |
          mkdir -p "$AITOOLS_HOST_CACHE_DIR" "$XDG_CACHE_HOME"
          test -z "$(find "$AITOOLS_HOST_CACHE_DIR" -mindepth 1 -print -quit)"
          test -z "$(find "$XDG_CACHE_HOME" -mindepth 1 -print -quit)"
          AITOOLS_ALLOCATION_CACHE_STATE=cold nix --option extra-substituters https://takeokunn-aitools.cachix.org --option extra-trusted-public-keys takeokunn-aitools.cachix.org-1:3HqAVajpH0kKeM3TJi5Z7rcBj6Y3CO17AbqkXKIuWvU= develop --command sbcl --script t/perf/search-allocation-timing.lisp
          test -n "$(find "$AITOOLS_HOST_CACHE_DIR" -mindepth 1 -print -quit)"
          test -n "$(find "$XDG_CACHE_HOME" -mindepth 1 -print -quit)"

      - name: Measure search allocation with warm cache (Darwin)
        env:
          AITOOLS_HOST_CACHE_DIR: ${{ runner.temp }}/aitools-search-allocation-host-cache
          XDG_CACHE_HOME: ${{ runner.temp }}/aitools-search-allocation-xdg-cache
          AITOOLS_ALLOCATION_CACHE_STATE: warm
        run: nix --option extra-substituters https://takeokunn-aitools.cachix.org --option extra-trusted-public-keys takeokunn-aitools.cachix.org-1:3HqAVajpH0kKeM3TJi5Z7rcBj6Y3CO17AbqkXKIuWvU= develop --command sbcl --script t/perf/search-allocation-timing.lisp
